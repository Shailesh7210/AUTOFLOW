table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: step
    using:
      foreign_key_constraint_on: step_id
event_triggers:
  - name: notify
    definition:
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: [status, output, error]
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: {{NHOST_BACKEND_URL}}/v1/functions/notify-webhook
select_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        workflow_run:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns: '*'
      filter:
        workflow_run:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        workflow_run:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
