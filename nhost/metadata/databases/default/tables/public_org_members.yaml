table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        org_id:
          _in:
            SELECT org_id FROM org_members WHERE user_id = X-Hasura-User-Id
  - role: editor
    permission:
      columns: [id, org_id, user_id, user_email, role]
      filter:
        org_id:
          _in:
            SELECT org_id FROM org_members WHERE user_id = X-Hasura-User-Id
  - role: viewer
    permission:
      columns: [id, org_id, user_id, user_email, role]
      filter:
        org_id:
          _in:
            SELECT org_id FROM org_members WHERE user_id = X-Hasura-User-Id
