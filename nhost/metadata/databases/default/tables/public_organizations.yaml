table:
  name: organizations
  schema: public
object_relationships: []
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
select_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns: '*'
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
